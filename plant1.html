<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分機通訊錄（一廠範例）</title>
<style>
:root{--bg:#F5F6F3;--ink:#1D2421;--mut:#5B655F;--line:#DCE0DB;--acc:#0F6B5C;--acc-d:#0A4A40;--warn-bg:#FBEFD5;--warn-ink:#5E3A00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7FB8AB;outline-offset:2px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:700;color:var(--acc)}
.nav{display:flex;flex-wrap:wrap;gap:2px 18px}
.nav button{background:none;border:0;padding:6px 2px;font-size:15px;color:var(--ink);cursor:pointer;border-bottom:3px solid transparent}
.nav button.on{font-weight:700;border-bottom-color:var(--acc)}
.cnt{margin-left:6px;display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#B3261E;color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px}
.demo{background:var(--warn-bg);color:var(--warn-ink);font-size:13px;text-align:center;padding:6px 12px}
.wrap{max-width:1280px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:30px;line-height:1.25}
h2{margin:0;font-size:18px}
.sub{font-size:15px;color:var(--mut);margin-top:4px}
.muted{font-size:13px;color:var(--mut)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
.row{display:grid;gap:12px;padding:10px 18px;border-bottom:1px solid #ECEFEB;font-size:15px;align-items:center}
.row.head{background:#EEF1ED;font-size:13px;font-weight:700;color:#3C4640;border-radius:12px 12px 0 0}
.row.sel{background:#EEF5F2}
.row.off{opacity:.55}
.ext{font-size:18px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;background:#E3F0EC;color:var(--acc-d);white-space:nowrap}
.badge.u{background:#FBEFD5;color:#7A4B00}.badge.g{background:#ECEFEB;color:#3C4640}.badge.r{background:#F6E2DF;color:#8A2A20}.badge.b{background:#E4ECFA;color:#1F3F7A}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;font-size:14px;border-radius:8px;cursor:pointer;background:#fff;color:var(--ink);border:1px solid #B8BFB8}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.in{width:100%;height:42px;padding:0 12px;font-size:15px;border:1px solid #B8BFB8;border-radius:8px;background:#fff;color:var(--ink)}
.btn{height:42px;padding:0 18px;font-size:15px;font-weight:700;color:#fff;background:var(--acc);border:0;border-radius:8px;cursor:pointer}
.btn.o{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn.s{height:34px;padding:0 12px;font-size:13px;font-weight:400;color:var(--ink);background:#fff;border:1px solid #B8BFB8;border-radius:6px}
.btn.s.d{color:#9B2C1F;border-color:#D9A9A2}
.btn[disabled]{opacity:.4;cursor:default}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.panel{padding:20px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:14px;font-weight:500}
.ck{display:flex;gap:8px;align-items:center;font-size:14px}
.ck input{width:18px;height:18px}
.warn{padding:10px 12px;background:var(--warn-bg);border-radius:8px;font-size:14px;color:var(--warn-ink);line-height:1.5}
.ok{padding:10px 12px;background:#E3F0EC;border-radius:8px;font-size:14px;color:var(--acc-d)}
.hide{display:none!important}
.sug{display:flex;flex-direction:column;border:1px solid #B8BFB8;border-radius:8px;overflow:hidden}
.sug button{text-align:left;padding:9px 12px;font-size:14px;background:#fff;border:0;border-bottom:1px solid #ECEFEB;cursor:pointer}
.sug button:hover{background:#EEF5F2}
.who{background:none;border:0;padding:4px 0;font:inherit;color:var(--acc-d);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.cards{display:flex;flex-wrap:wrap;gap:18px}
.card{flex:1 1 300px;padding:22px;display:flex;flex-direction:column;gap:12px}
.card .k{font-size:13px;font-weight:700;color:var(--acc)}
.card .t{font-size:19px;font-weight:700}
.card p{margin:0;font-size:14px;color:#3C4640;line-height:1.6}
.nd{display:inline-block;width:.62em;text-align:center}
.p2 .c .x,.ccard .x{white-space:nowrap;flex:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{border:1.5px solid var(--acc);border-radius:10px;overflow:hidden;background:#fff}
.ccard h3{margin:0;background:var(--acc);color:#fff;padding:7px 14px;font-size:15px}
.ccard h4{margin:0;background:#EEF5F2;color:var(--acc-d);padding:4px 14px;font-size:13px}
.ccard>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;min-height:40px;border-bottom:1px solid #E6EAE5;font-size:15px}
.ccard small{display:block;font-size:12px;color:var(--mut)}
.ccard .x{font-size:21px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.note{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#FAFBF9}
.note .det{font-size:14px;color:#3C4640;margin-top:4px;line-height:1.5}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;margin-right:8px}
.tag.new{background:#E3F0EC;color:var(--acc-d)}.tag.mv{background:#E4ECFA;color:#1F3F7A}.tag.out{background:#F6E2DF;color:#8A2A20}.tag.up{background:#EFE6F7;color:#4B2A7A}
.toast{position:fixed;right:20px;bottom:20px;max-width:380px;background:#1D2421;color:#fff;border-radius:12px;padding:12px 16px;z-index:20;font-size:14px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.3)}
/* 列印預覽 */
.sheetscroll{overflow:auto;padding-bottom:8px}
.sheet{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);margin:0 auto}
.sheet.portrait{width:794px;height:1123px}.sheet.landscape{width:1123px;height:794px}
.p1{padding:22px 26px;display:flex;flex-direction:column;gap:6px;color:#000;font-family:"標楷體","DFKai-SB","KaiTi","Noto Serif TC",serif;font-weight:700}
.p1 .tt{text-align:center;font-size:20px;line-height:1.3}
.p1 .tt small{font-size:12px;margin-left:14px;font-weight:400}
.p1 .grid{display:flex;border:1px solid #000;align-items:flex-start}
.p1 .col{flex:1;min-width:0}
.p1 .col+.col{border-left:2px solid #000}
.p1 .r{display:grid;grid-template-columns:1fr 46px 34px;height:17px;line-height:16px;border-bottom:1px solid #000;font-size:12px;text-align:center}
.p1 .r>div{border-left:1px solid #000;overflow:hidden;white-space:nowrap;padding:0 2px}
.p1 .r>div:first-child{border-left:0}
.p1 .r.h1{background:#FFFF00;display:block;text-align:center;letter-spacing:.05em}
.p1 .r.h2{background:#EDEDED;display:block}
.p1 .r.h2.c{background:#CCFFFF}.p1 .r.h2.y{background:#FFFF00}
.p1 .r.gap{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#f3f3f3 4px,#f3f3f3 8px)}
.p1 .foot{margin-top:auto;border:1px solid #000;padding:5px 10px;font-size:10.5px;line-height:1.45;font-weight:400}
.p2{padding:22px 26px;display:flex;flex-direction:column;gap:10px;--rh:18px;--f:11px}
.sheet.p2{height:auto}.sheet.landscape.p2{min-height:794px}.sheet.portrait.p2{min-height:1123px}
.p2 .tt{display:flex;align-items:baseline;justify-content:space-between}.p2 .tt b{font-size:20px}
.p2 .g{display:flex;gap:10px;align-items:flex-start}
.p2 .pc{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.p2 .c{border:1.5px solid var(--acc);border-radius:8px;overflow:hidden}
.p2 .c h3{margin:0;background:var(--acc);color:#fff;padding:0 8px;height:calc(var(--rh) + 2px);display:flex;align-items:center;font-size:calc(var(--f) + 1.5px)}
.p2 .c h5{margin:0;background:#EEF5F2;color:var(--acc-d);padding:0 8px;height:var(--rh);display:flex;align-items:center;font-size:var(--f)}
.p2 .c div.i{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;height:var(--rh);border-bottom:1px solid #E6EAE5;font-size:var(--f)}
.p2 .c div.i.u{background:#FFFBEF}
.p2 .c div.i>span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p2 .c .x{font-size:calc(var(--f) + 3px);font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.p2 .foot{margin-top:auto;background:#EEF5F2;border-radius:8px;padding:6px 12px;font-size:10px;line-height:1.5}
.sheetbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
@media print{
 body{background:#fff}.top,.demo,.noprint,.toast{display:none!important}
 .wrap{padding:0;max-width:none}.wrap>:not(.printview){display:none!important}
 .sheet{box-shadow:none;margin:0}
}
@media(max-width:700px){.wrap{padding:20px 14px}.top-in{padding:10px 14px}h1{font-size:24px}}
</style>
</head>

function drawLayout1(){
  var L=layout(),h='<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px"><h2>各欄內容</h2><button class="btn s" id="l-bal">自動平衡欄高</button></div>';
  for(var c=1;c<=3;c++){var n=L.counts[c-1];h+='<div><div style="display:flex;justify-content:space-between;font-weight:700;margin:6px 0"><span>第 '+c+' 欄</span><span class="muted" style="color:'+(n>52?'#B3261E':'var(--mut)')+'">'+n+' 列'+(n>52?'（過長）':'')+'</span></div>';
    var bl=L.blocks.filter(function(b){return b.col===c-1});
    if(c===1&&L.cols[0].length&&L.cols[0][0].dept===null)h+='<div class="note" style="padding:6px 12px"><span>（置頂：緊急專線、總機、廠長、副廠長）</span><span class="muted">'+L.cols[0][0].rows.length+' 列</span></div>';
    bl.forEach(function(b,i){h+='<div class="note" style="padding:6px 12px;margin-top:4px"><span>'+esc(b.d.name)+' <span class="muted">'+b.rows.length+' 列</span></span><span style="display:flex;gap:4px;align-items:center"><button class="btn s" data-bu="'+b.d.id+'"'+(i===0?' disabled':'')+' aria-label="上移">↑</button><button class="btn s" data-bd="'+b.d.id+'"'+(i===bl.length-1?' disabled':'')+' aria-label="下移">↓</button><select class="in" style="height:34px;width:78px;padding:0 6px" data-bc="'+b.d.id+'" aria-label="換欄"><option value="1"'+(c===1?' selected':'')+'>第1欄</option><option value="2"'+(c===2?' selected':'')+'>第2欄</option><option value="3"'+(c===3?' selected':'')+'>第3欄</option></select></span></div>'});
    h+='</div>'}
  $('l-blocks').innerHTML=h;
  var ck=checks(),k='<h2>列印前檢查 <span class="muted">'+(ck.length?ck.length+' 項提醒':'')+'</span></h2>';
  if(!ck.length)k+='<div class="ok">沒有警告。</div>';ck.forEach(function(x){k+='<div class="warn">'+esc(x.t)+'</div>'});
  k+='<div class="muted">警告只提醒、不擋匯出。</div>';$('l-checks').innerHTML=k;
  $('l-sheet').innerHTML=sheet1();fit();
  var q=function(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f)};
  q('[data-bc]',function(s){s.onchange=function(){var d=dById(s.getAttribute('data-bc'));d.col=+s.value;var mx=0;tops().forEach(function(t){if(t.col===d.col&&t!==d)mx=Math.max(mx,t.ord||0)});d.ord=mx+1;touch('廠務（範例）','貼牆版：「'+d.name+'」移到第 '+d.col+' 欄');drawLayout()}});
  q('[data-bu]',function(b){b.onclick=function(){mv(b.getAttribute('data-bu'),-1)}});q('[data-bd]',function(b){b.onclick=function(){mv(b.getAttribute('data-bd'),1)}});
  $('l-bal').onclick=function(){var bs=layout().blocks.slice().sort(function(a,b){return (a.d.col-b.d.col)||(a.d.ord-b.d.ord)}),len=[0,0,0],top=layout().cols[0].filter(function(x){return x.dept===null}).reduce(function(s,x){return s+x.rows.length},0);len[0]=top;
    bs.forEach(function(b){var m=len.indexOf(Math.min.apply(null,len));b.d.col=m+1;b.d.ord=len[m]+1;len[m]+=b.rows.length});
    var o={};bs.forEach(function(b){o[b.d.col]=(o[b.d.col]||0)+1;b.d.ord=o[b.d.col]});touch('廠務（範例）','貼牆版：自動平衡欄高');drawLayout();toast('已依序填入最短的欄')};

function mv(id,dir){var d=dById(id),sib=tops().filter(function(t){return t.col===d.col}).sort(function(a,b){return a.ord-b.ord}),i=sib.indexOf(d),o=sib[i+dir];if(!o)return;var t=d.ord;d.ord=o.ord;o.ord=t;touch('廠務（範例）','貼牆版：調整「'+d.name+'」順序');drawLayout()}
function fit(){Array.prototype.forEach.call(document.querySelectorAll('.sheetscroll'),function(w){var s=w.firstElementChild;if(!s)return;var a=w.clientWidth,need=s.classList.contains('landscape')?1123:794;s.style.zoom=a&&a<need?a/need:1})}
window.addEventListener('resize',fit);
/* ----- 列印版 2：分欄 ----- */
var P2={l:null,p:null};
function p2Blocks(){
  var out=[],tp=recs.filter(function(r){return printable(r)&&!r.dept}).sort(function(a,b){return a.sort-b.sort});
  if(tp.length)out.push({id:'_top',name:'置頂',rows:tp.map(rowOfRec),lines:tp.length+1});
  tops().forEach(function(d){var rows=blockRows(d,0).filter(function(r){return r.k!=='e'});out.push({id:d.id,name:d.name,rows:rows,lines:rows.length})});
  return out;
}
function p2N(o){return o==='l'?4:3}
function autoBal2(o){
  var N=p2N(o),bs=p2Blocks(),tot=bs.reduce(function(s,b){return s+b.lines+1},0),tg=tot/N,cur=0,c=0,cfg={},cnt=[0,0,0,0];
  bs.forEach(function(b){if(cur>0&&c<N-1&&cur+(b.lines+1)/2>tg){c++;cur=0}cfg[b.id]={c:c+1,o:++cnt[c]};cur+=b.lines+1});
  P2[o]=cfg;
}
function p2Cols(o){
  if(!P2[o])autoBal2(o);
  var N=p2N(o),cfg=P2[o],cols=[];for(var i=0;i<N;i++)cols.push([]);
  p2Blocks().forEach(function(b){var k=cfg[b.id]||(cfg[b.id]={c:1,o:99});b.k=k;cols[Math.min(N,k.c)-1].push(b)});
  cols.forEach(function(c){c.sort(function(a,b){return a.k.o-b.k.o})});
  var avail=o==='l'?690:1010,w=cols.map(function(c){return c.reduce(function(s,b){return s+b.lines+0.7},0)}),mx=Math.max.apply(null,w);
  var raw=Math.floor(avail/mx),rh=Math.max(13,Math.min(24,raw));
  return {N:N,cols:cols,w:w,rh:rh,over:raw<13,mx:mx,avail:avail};
}
function sheet2(o){
  var P=p2Cols(o),h='<div class="sheet '+(o==='p'?'portrait':'landscape')+' p2" style="--rh:'+P.rh+'px;--f:'+(P.rh*0.62).toFixed(1)+'px"><div class="tt"><b>'+esc(PLANT.name)+'分機表</b><span class="muted">'+fmtDate()+'</span></div><div class="g">';
  P.cols.forEach(function(c){h+='<div class="pc">';c.forEach(function(b){
    h+='<div class="c"><h3>'+esc(b.name)+'</h3>';
    b.rows.forEach(function(r,i){if(r.k==='h1')return;if(r.k==='h2')h+='<h5>'+esc(r.text)+'</h5>';else h+='<div class="i'+(r.k==='u'?' u':'')+'"><span>'+esc(r.text)+'</span><span class="x">'+nd(r.ext)+'</span></div>'});
    h+='</div>'});h+='</div>'});
  h+='</div><div class="foot">'+PLANT.foot.slice(0,3).map(esc).join('　｜　')+'</div></div>';
  return h;
}
function drawLayout2(){
  var P=p2Cols(ori2),h='<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px"><h2>各欄內容（'+(ori2==='l'?'橫式':'直式')+'）</h2><button class="btn s" id="l-bal">自動平衡欄高</button></div>';
  P.cols.forEach(function(c,i){h+='<div><div style="display:flex;justify-content:space-between;font-weight:700;margin:6px 0"><span>第 '+(i+1)+' 欄</span><span class="muted">'+c.reduce(function(s,b){return s+b.lines},0)+' 列</span></div>';
    c.forEach(function(b,j){h+='<div class="note" style="padding:6px 12px;margin-top:4px"><span>'+esc(b.name)+' <span class="muted">'+b.lines+' 列</span></span><span style="display:flex;gap:4px;align-items:center"><button class="btn s" data-bu="'+b.id+'"'+(j===0?' disabled':'')+' aria-label="上移">↑</button><button class="btn s" data-bd="'+b.id+'"'+(j===c.length-1?' disabled':'')+' aria-label="下移">↓</button><select class="in" style="height:34px;width:78px;padding:0 6px" data-bc="'+b.id+'" aria-label="換欄">'+P.cols.map(function(_,k){return '<option value="'+(k+1)+'"'+(k===i?' selected':'')+'>第'+(k+1)+'欄</option>'}).join('')+'</select></span></div>'});
    h+='</div>'});
  $('l-blocks').innerHTML=h;
  var ck=checks().filter(function(x){return x.t.indexOf('欄')<0});
  if(P.over)ck.push({t:'內容太多，一頁放不下（列高已縮到最小 13px）。正式版會自動接到第二頁；可以改用另一個方向，或把欄調平均。'});
  var k='<h2>列印前檢查 <span class="muted">'+(ck.length?ck.length+' 項提醒':'')+'</span></h2><div class="'+(P.over?'warn':'ok')+'">目前列高 '+P.rh+'px（約 '+(P.rh*0.62*0.75).toFixed(1)+' pt 字），'+(P.over?'超過一頁':'一頁放得下')+'。</div>';
  ck.forEach(function(x){k+='<div class="warn">'+esc(x.t)+'</div>'});k+='<div class="muted">警告只提醒、不擋匯出。</div>';$('l-checks').innerHTML=k;
  $('l-sheet').innerHTML=sheet2(ori2);fit();
  var q=function(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f)};
  var nm=function(id){return id==='_top'?'置頂':dById(id).name};
  q('[data-bc]',function(s){s.onchange=function(){var id=s.getAttribute('data-bc'),cfg=P2[ori2],mx=0;Object.keys(cfg).forEach(function(x){if(cfg[x].c===+s.value&&x!==id)mx=Math.max(mx,cfg[x].o)});cfg[id]={c:+s.value,o:mx+1};touch('廠務（範例）','新風格版：「'+nm(id)+'」移到第 '+s.value+' 欄');drawLayout2()}});
  var mv2=function(id,dir){var cfg=P2[ori2],c=cfg[id].c,sib=Object.keys(cfg).filter(function(x){return cfg[x].c===c}).sort(function(a,b){return cfg[a].o-cfg[b].o}),i=sib.indexOf(id),o=sib[i+dir];if(!o)return;var t=cfg[id].o;cfg[id].o=cfg[o].o;cfg[o].o=t;touch('廠務（範例）','新風格版：調整「'+nm(id)+'」順序');drawLayout2()};
  q('[data-bu]',function(b){b.onclick=function(){mv2(b.getAttribute('data-bu'),-1)}});q('[data-bd]',function(b){b.onclick=function(){mv2(b.getAttribute('data-bd'),1)}});
  $('l-bal').onclick=function(){autoBal2(ori2);touch('廠務（範例）','新風格版：自動平衡欄高');drawLayout2();toast('已依序平均分到各欄')};
}
function bindLayout(){
  if(goArg&&goArg.tab){layTab=goArg.tab;goArg=null;render();return}
  Array.prototype.forEach.call(document.querySelectorAll('[data-lt]'),function(b){b.onclick=function(){layTab=+b.getAttribute('data-lt');render()}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-o]'),function(b){b.onclick=function(){ori2=b.getAttribute('data-o');render()}});
  drawLayout();
}
